<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A webpage for fantasy character cards.">
    <meta name="author" content="Jordan Harris">
    <title>Character Card</title>
    <link rel="stylesheet" href="style.css">
  <script src="character.js" defer></script>
</head>
<body>
    <div class="card">
        <div class="image">
            <img src="snortleblat.webp" alt="snortleblat warrior">
        </div>
        <div class="name">
            <h2>Snortleblat</h2>
        </div>
        <div class="stats">
            <p><strong>Class:</strong> Swamp Beast Diplomat</p>
            <p><strong>Level:</strong> 5</p>
            <p><strong>Health:</strong> 100</p>
        </div>
        <button class="buttons">
            Attacked
        </button>
        <button class="buttons">
            Level Up
        </button>
    </div>
</body>
</html>
