<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Credit Card Form.">
    <meta name="author" content="Jordan Harris">
  <title>Credit Card Form</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <script src="card.js" defer></script>
</head>

<body>

  <h1>Checkout</h1>

  <section class="errors" aria-live="polite"></section>

  <form id="cardForm">

    <div class="card-container">

      <!-- CARD FRONT -->
      <div class="card-front">
        <p class="total">TOTAL: $199</p>
        <span class="card-icon">💳</span>

        <label id="cardNumberLabel">CARD NUMBER</label>
        <input type="text" id="cardNumber" required name="cardNumber" pattern="[0-9]{16}" maxlength="16" required placeholder="1234123412341234">

        <label id="cardHolderLabel">CARD HOLDER</label>
        <input type="text" id="cardHolder" required placeholder="John Doe">

        <div id="cardExpiration">
          <label for="expirationDate">EXPIRATION</label>
          <input type='text' id='month' name="expMonth" placeholder="MM" aria-labelledby="expirationDate">
          <input type='text' id='year' name="expYear" placeholder="YY" aria-labelledby="expirationDate">
        </div>
      </div>

      <!-- CARD BACK -->
      <div class="card-back">
        <button type="submit">Submit</button>
        <div class="black-strip"></div>

        <label for="cvc">CVC/CVV</label>
        <input type="text" id="cvc" name="cvc" pattern="[0-9]{3}" maxlength="3" required placeholder="xxx">
      </div>

    </div>

  </form>

</body>
</html>
