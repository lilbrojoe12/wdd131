<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A webpage with dessert recipes.">
    <meta name="author" content="Jordan Harris">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipes">
    <meta property="og:description" content="A webpage with dessert recipes.">
    <meta property="og:url" content="https://lilbrojoe12.github.io/wdd131/recipes">
    <link rel="icon" href="favicon.ico">
    <title>Recipes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="title">
        <img src="images/recipe-book.png" alt="Recipe Book Logo">
        <h1>RecipeBook</h1>
        </div>
    </header>
    <main>
        <div class="search">
            <input type="text" placeholder="Find a recipe">
            <button>
                <img src="images/search.svg" alt="Search">
            </button>
        </div>
        <section class="recipe-card">
            <img src="images/apple-crisp.jpg" alt="Apple Crisp">
            <div class="recipe-details">
                <span class="category">
                    dessert
                </span>
                <h2>Apple Crisp</h2>
                <span
                class="rating"
                role="img"
                aria-label="Rating: 4 out of 5 stars">
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star-empty">☆</span>
                </span>
                <p>
                    This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.
                </p>
            </div>
        </section>
    </main>
    <footer>
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
    </footer>
</body>
</html>
